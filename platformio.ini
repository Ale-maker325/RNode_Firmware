; tern: проект PlatformIO для платы tern-nRF52840 ProMicro (не часть оригинала RNode_Firmware).
; Окружение выбирается кнопкой внизу VS Code, как в Meshtastic:
;   *_m30s_* — модуль E22-xxxM30S (1 Вт), *_m33s_* — E22-xxxM33S (2 Вт); *_2s / *_3s — батарея.
; Готовый .uf2 кладётся в tern/build/. Описание платы: tern/platformio/boards/tern_promicro.json,
; распиновка: tern/arduino/hardware/tern/nrf52/variants/tern_promicro/variant.h (общая с arduino-cli).

[platformio]
src_dir = .
boards_dir = tern/platformio/boards
default_envs = tern_promicro_m30s_2s

[env]
platform = platformio/nordicnrf52@10.11.0
framework = arduino
board = tern_promicro
board_build.variants_dir = tern/arduino/hardware/tern/nrf52/variants

; Компилируем только исходники в корне, как arduino-cli для скетча (без Console/, Release/, tern/ и т. п.)
build_src_filter = -<*> +<RNode_Firmware.ino> +<*.cpp>

build_flags =
  -DBOARD_MODEL=0x5A
  ; P0.09/P0.10 (RESET и DIO1 радио) — обычные выводы, а не NFC
  -DCONFIG_NFCT_PINS_AS_GPIOS
  ; объявления функций, которые генератор прототипов PlatformIO пропускает
  -include tern/platformio/prototypes.h

lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  adafruit/Adafruit SH110X
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit NeoPixel
  lewisxhe/XPowersLib
  rweather/Crypto@0.4.0
  zinggjm/GxEPD2

extra_scripts = post:tern/platformio/uf2.py

monitor_speed = 115200

[env:tern_promicro_m30s_2s]
build_flags = ${env.build_flags} -DTERN_E22_M30S

[env:tern_promicro_m30s_3s]
build_flags = ${env.build_flags} -DTERN_E22_M30S -DTERN_BATTERY_3S

[env:tern_promicro_m33s_2s]
build_flags = ${env.build_flags} -DTERN_E22_M33S

[env:tern_promicro_m33s_3s]
build_flags = ${env.build_flags} -DTERN_E22_M33S -DTERN_BATTERY_3S
